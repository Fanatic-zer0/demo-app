{{- range $serviceName, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "oms-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      labels:
        {{- include "oms-demo.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
    spec:
      containers:
        - name: {{ $serviceName }}
          image: {{ $.Values.global.imageRegistry }}/{{ $service.image }}:{{ $.Values.global.imageTag }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: PORT
              value: "{{ $service.port }}"
            {{- if $service.needsRedis }}
            - name: REDIS_URL
              value: "redis://{{ $.Values.redis.serviceName }}:{{ $.Values.redis.port }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $service.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "oms-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: {{ $serviceName }}
  ports:
    # Same port as the container so http://<service-name>:{{ $service.port }} works identically
    # in docker compose and inside the cluster, with no per-environment URL overrides.
    - name: http
      port: {{ $service.port }}
      targetPort: http
{{- end }}